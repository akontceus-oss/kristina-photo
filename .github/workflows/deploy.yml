# Сборка сайта и выкладка на виртуальный хостинг (REG.RU, TimeWeb и т.п.) по FTP при каждом push в main.
# В репозитории нужно добавить секреты (Settings → Secrets and variables → Actions):
#   FTP_SERVER   — адрес FTP-сервера из панели хостинга (например, server123.hosting.reg.ru)
#   FTP_USERNAME — логин от FTP (из панели хостинга)
#   FTP_PASSWORD — пароль от FTP
#   FTP_DIR      — папка сайта на хостинге, например /www/emozioniinapp.ru/
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # Пока секреты FTP не заданы, сайт только собирается (проверка), без выкладки
      - name: Upload via FTP
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_DIR }}
